[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "candlefeed"
version = "0.1.2"
description = "Official Python client for the CandleFeed crypto market-data API — OHLCV, funding, open interest, liquidations, basis, options. Returns pandas DataFrames."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CandleFeed", email = "support@candlefeed.ai" }]
keywords = [
    "crypto",
    "algotrading",
    "backtesting",
    "market-data",
    "crypto-derivatives",
    "funding-rates",
    "open-interest",
    "liquidations",
    "pandas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.25",
    "pandas>=1.3",
]

[project.optional-dependencies]
polars = ["polars>=0.20"]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
    "ruff>=0.4",
    "build>=1.0",
]

[project.urls]
Homepage = "https://candlefeed.ai"
Documentation = "https://candlefeed.ai/docs"
Pricing = "https://candlefeed.ai/#pricing"
Repository = "https://github.com/candlefeed-ai/candlefeed-python"

[tool.hatch.build.targets.wheel]
packages = ["candlefeed"]

[tool.hatch.build.targets.sdist]
include = ["candlefeed", "README.md", "LICENSE", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]
